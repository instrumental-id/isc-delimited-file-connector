# Help text for fields
help.hostname=The hostname or IP address of the remote server
help.port=The port number to connect to on the remote server
help.path=The path to the file on the remote system
help.username=Username for authentication
help.password=Password for authentication
help.privateKey=Private key in PEM format for certificate-based authentication
help.privateKeyPassphrase=Passphrase for the private key if it is encrypted
help.domain=Windows domain name for SMB authentication
help.workgroup=Windows workgroup name for SMB authentication
help.share=SMB share name to connect to
help.webdavUrl=The base WebDAV URL (e.g., https://webdav.example.com)
help.webdavToken=Optional bearer token for WebDAV authentication
help.url=The full HTTP/HTTPS URL to the file
help.bearerToken=Bearer token for HTTP authentication
help.httpHeaders=Additional HTTP headers in key:value format
help.gcpProjectId=Google Cloud Project ID
help.gcsBucket=Google Cloud Storage bucket name
help.gcpCredentialsJson=Service account credentials JSON for Google Cloud
help.azureConnectionString=Azure Storage Account connection string
help.azureContainerName=Azure Blob Storage container name
help.bucket=S3 bucket name
help.region=AWS region for the S3 bucket (e.g., us-east-1)
help.awsAccessKeyId=AWS access key ID for authentication
help.awsSecretKey=AWS secret access key for authentication
help.delimiter=Character used to separate fields in the file (default: comma)
help.header=Whether the file contains a header row
help.columns=List of column names if the file does not have a header row

